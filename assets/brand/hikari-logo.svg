<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hikari (光, "light") app icon: original artwork, MIT with the project. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9CC8"/>
      <stop offset="0.55" stop-color="#E86BB8"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFE6F4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFE6F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824 pt squircle-ish rounded rect centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- soft light behind the star -->
  <circle cx="500" cy="530" r="300" fill="url(#glow)"/>
  <!-- main four-point sparkle (concave sides) -->
  <path fill="#FFFFFF" d="M500 230 C 528 430, 600 502, 800 530 C 600 558, 528 630, 500 830 C 472 630, 400 558, 200 530 C 400 502, 472 430, 500 230 Z"/>
  <!-- small companion sparkle -->
  <path fill="#FFFFFF" fill-opacity="0.92" d="M738 236 C 746 292, 766 312, 822 320 C 766 328, 746 348, 738 404 C 730 348, 710 328, 654 320 C 710 312, 730 292, 738 236 Z"/>
  <!-- tiny dot -->
  <circle cx="300" cy="300" r="22" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
