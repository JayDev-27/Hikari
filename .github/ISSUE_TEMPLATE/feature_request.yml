name: Feature or improvement
description: Suggest something new for Hikari.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this make better?
      description: The problem or moment it improves, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: work
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (Winter of Code Social participants, say so here).
