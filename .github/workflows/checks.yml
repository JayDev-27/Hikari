name: Code checks

# Runs on free GitHub-hosted Ubuntu runners (free for this public repo). The Rust/Tauri checks need macOS and
# live in rust.yml, which only runs when Rust code changes: macOS runners queue for minutes, Ubuntu starts at once.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its older run; every push to main gets a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend, protocol and packs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated protocol types
        run: pnpm check:protocol

      - name: Lint TypeScript
        run: pnpm -F desktop lint --max-warnings 0

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Run desktop tests (gestures, Iki/Live2D packs, protocol, runtime)
        run: pnpm -F desktop test

      - name: Audit Live2D rigs (skipped without the licensed Cubism Core)
        run: pnpm -F desktop audit:models

      - name: Build desktop frontend
        run: pnpm -F desktop build

  website:
    name: Website (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Lint website
        run: npx eslint . --max-warnings 0

      - name: Typecheck and build website (same command Vercel runs)
        run: npm run build

  scripts:
    name: Pipeline scripts, data and guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Node scripts parse (model pipeline, dev tools, protocol)
        run: |
          fail=0
          for f in $(git ls-files '*.mjs' '*.js' | grep -E '^(apps/desktop/(dev|scripts)|packages|scripts)/'); do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - name: Shell scripts parse (assemble-*.sh and dev tools)
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }; done
          exit $fail

      - name: Python scripts compile (model pipeline)
        run: git ls-files '*.py' | xargs -r python3 -m py_compile

      - name: Character packs, fixtures and protocol JSON are valid
        run: |
          fail=0
          for f in $(git ls-files '*.json' | grep -E '^(characters|fixtures|packages/protocol)/'); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

      - name: No licensed Cubism Core or secrets committed
        run: |
          if git ls-files | grep -iE 'live2dcubismcore|(^|/)\.env($|\.)|credentials\.json$'; then
            echo "::error::Cubism Core (licence) or a secrets file is committed; remove it (see CLAUDE.md)"
            exit 1
          fi
