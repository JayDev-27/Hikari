name: Dependency review

# Fails a pull request that adds a dependency with a known high-severity vulnerability or a licence that would
# conflict with the MIT licence. Many contributors means many new packages; this catches the risky ones.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never
