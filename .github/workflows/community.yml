name: Community

# Bots for a busy Winter of Code Social season. None of these jobs check out or run pull request code, so
# pull_request_target (which can comment on forks' PRs) is safe here.

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened]

permissions: {}

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      # Titles become squash-merge commit messages: "feat(website): …", "fix(vrm): …", "docs: …".
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the summary after the colon with a lowercase letter, e.g. "fix(website): keep heads inside the cast cards".

  pr-size:
    name: Size label
    if: github.event_name == 'pull_request_target' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // Lock files and generated assets would make every dependency bump look huge.
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
            const ignored = /(^|\/)(package-lock\.json|pnpm-lock\.yaml|Cargo\.lock)$|\.(png|jpe?g|webp|gif|mp4|moc3|vrm)$/i;
            const lines = files.filter(f => !ignored.test(f.filename)).reduce((n, f) => n + f.additions + f.deletions, 0);
            const sizes = [['size: XS', 10], ['size: S', 100], ['size: M', 400], ['size: L', 1000], ['size: XL', Infinity]];
            const [label] = sizes.find(([, max]) => lines <= max);
            const current = pr.labels.map(l => l.name).filter(n => n.startsWith('size: '));
            for (const old of current) if (old !== label) await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: old });
            if (!current.includes(label)) await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [label] });
            if (label === 'size: XL') core.notice(`${lines} changed lines: consider splitting this pull request so it can be reviewed.`);

  welcome:
    name: Welcome first-time contributors
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue in Hikari! A maintainer will take a look soon.
            If you'd like to work on it yourself, say so in a comment, and please read [CONTRIBUTING.md](https://github.com/JayDev-27/Hikari/blob/main/CONTRIBUTING.md) first.
          pr_message: |
            Thanks for your first pull request to Hikari, and welcome! 🌸
            A few things that make review quick:
            - Link the issue you claimed (`Closes #123`) and keep the PR to that one issue.
            - Use a conventional title, e.g. `fix(website): …` or `docs: …`. The title check will tell you if it's off.
            - Make sure **Code checks** pass. The commands are in [CONTRIBUTING.md](https://github.com/JayDev-27/Hikari/blob/main/CONTRIBUTING.md), including our AI-use policy.
            - For anything visible, add a screenshot or a short recording.
            WOCS participants: a maintainer will add the `wocs` and level labels.
